en:
  site_settings:
    crimson_server_list_enabled: "Enable the independent private server top list."
    crimson_server_list_submission_enabled: "Allow signed-in members to submit servers."
    crimson_server_list_require_approval: "Require administrator approval before publishing a submission."
    crimson_server_list_votes_enabled: "Allow members to vote for each server once per day."
    crimson_server_list_results_limit: "Maximum number of servers returned by the top list."
    crimson_server_list_live_query_enabled: "Enable live server status and player-count probes through Sidekiq."
    crimson_server_list_query_interval_minutes: "How often published servers should be probed for live status."
    crimson_server_list_connect_timeout_ms: "Maximum connection time in milliseconds."
    crimson_server_list_read_timeout_ms: "Maximum response read time in milliseconds."
    crimson_server_list_extra_allowed_ports: "Extra ports or ranges allowed in addition to game defaults. Separate entries with |, for example 2456-2458|30000."
    crimson_server_list_allowed_host_suffixes: "Optional strict hostname suffix allowlist separated by |. When blank, only safe public Internet targets are accepted."
    crimson_server_list_reviews_enabled: "Allow forum members to leave a comment and a 1–5 star rating."
    crimson_server_list_owner_edits_require_approval: "Send owner edits back to the administrator approval queue."
    crimson_server_list_reviews_limit: "Maximum number of reviews returned on a server detail page."
    crimson_server_list_verification_enabled: "Allow listing owners to prove control of a hostname with a DNS TXT challenge."
    crimson_server_list_verification_challenge_hours: "How many hours a DNS TXT verification challenge remains valid."
  crimson_server_list:
    statuses:
      unknown: "Unverified"
      online: "Online"
      offline: "Offline"
      maintenance: "Maintenance"
    messages:
      submitted: "Your server was submitted for administrator approval."
      published: "The server was published."
      voted: "Your vote was recorded. You can vote again tomorrow."
      updated: "The server was updated."
      updated_pending: "The changes were saved and sent for administrator approval again."
      reviewed: "Your comment and star rating were saved."
      review_deleted: "Your review was removed."
      deleted: "The server listing was deleted."
      claim_submitted: "Your ownership claim was sent for administrator review."
      claim_approved: "The ownership claim was approved and the listing was transferred."
      claim_rejected: "The ownership claim was rejected."
      verification_started: "DNS verification challenge created. Add the TXT record, then check verification."
      verification_succeeded: "Server ownership was verified through DNS."
    errors:
      submissions_disabled: "Server submissions are currently disabled."
      votes_disabled: "Server voting is currently disabled."
      already_voted: "You have already voted for this server today."
      reviews_disabled: "Server reviews are currently disabled."
      not_owner: "You are not allowed to edit this server."
      unsafe_endpoint: "The server host or query port is not allowed by the security policy."
      already_owner: "You already own this server listing."
      claim_pending: "You already have a pending ownership claim for this server."
      invalid_claim_decision: "Invalid ownership claim decision."
      claim_already_reviewed: "This ownership claim has already been reviewed."
      verification_disabled: "Server verification is currently disabled."
      verification_not_eligible: "Automatic verification requires a safe public hostname; IP literals are not supported."
      verification_challenge_missing: "Create a DNS verification challenge before checking it."
      verification_challenge_expired: "This DNS verification challenge expired. Create a new challenge."
      verification_failed: "The expected DNS TXT record was not found yet."
      verification_lookup_failed: "The DNS verification lookup could not be completed. Try again later."
      verification_rate_limited: "Verification was checked too recently. Please wait before trying again."
